<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — First Class Washing Bay</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #f7f9fc;
    color: #1c1b2e;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 380px; }
  h1 { font-size: 22px; margin-bottom: 10px; }
  p { color: #5f5f72; font-size: 15px; line-height: 1.6; }
  button {
    margin-top: 20px;
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    background: #493ee5;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>
      This page hasn't been opened yet on this device, so it isn't available offline. Pages you've already visited
      will still work, and anything you save while offline is queued to sync automatically once you're back online.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
