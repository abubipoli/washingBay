services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: washbay
      POSTGRES_PASSWORD: washbay
      POSTGRES_DB: washbay
    ports:
      - "5432:5432"
    volumes:
      - washbay_pgdata:/var/lib/postgresql/data

volumes:
  washbay_pgdata:
